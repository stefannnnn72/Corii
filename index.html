<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love you🤭😋</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0608;
    --rose: #c9465a;
    --rose-light: #e8869a;
    --gold: #d4a853;
    --cream: #f5ede0;
    --muted: #7a6570;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Courier Prime', monospace;
    cursor: crosshair;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.4;
    z-index: 100;
  }

  /* Radial glow */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(201,70,90,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 3rem;
    opacity: 0;
    animation: fadeIn 2s ease 0.5s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .eyebrow {
    font-family: 'Courier Prime', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: slideUp 1s ease 1s forwards;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .heart-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 2rem;
    opacity: 0;
    animation: heartAppear 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 1.4s forwards;
  }

  @keyframes heartAppear {
    from { opacity: 0; transform: scale(0.3) rotate(-15deg); }
    to   { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .heart-svg {
    width: 80px;
    height: 80px;
    filter: drop-shadow(0 0 20px rgba(201,70,90,0.6)) drop-shadow(0 0 50px rgba(201,70,90,0.3));
    animation: heartbeat 1.8s ease-in-out infinite 2.8s;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(201,70,90,0.6)) drop-shadow(0 0 50px rgba(201,70,90,0.3)); }
    14%  { transform: scale(1.18); filter: drop-shadow(0 0 30px rgba(201,70,90,0.9)) drop-shadow(0 0 70px rgba(201,70,90,0.5)); }
    28%  { transform: scale(1); }
    42%  { transform: scale(1.12); filter: drop-shadow(0 0 25px rgba(201,70,90,0.8)) drop-shadow(0 0 60px rgba(201,70,90,0.4)); }
    70%  { transform: scale(1); }
  }

  .main-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 10vw, 7rem);
    font-weight: 700;
    color: var(--cream);
    line-height: 0.9;
    letter-spacing: -0.02em;
    opacity: 0;
    animation: titleReveal 1.4s ease 2s forwards;
    position: relative;
  }

  .main-title .italic {
    font-style: italic;
    color: var(--rose-light);
  }

  @keyframes titleReveal {
    from { opacity: 0; transform: translateY(20px) skewY(2deg); }
    to   { opacity: 1; transform: translateY(0) skewY(0deg); }
  }

  .divider {
    margin: 1.8rem auto;
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: expandLine 1.5s ease 3s forwards;
    opacity: 0.7;
  }

  @keyframes expandLine {
    to { width: 180px; }
  }

  .subtitle {
    font-family: 'Courier Prime', monospace;
    font-style: italic;
    font-size: 0.9rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    opacity: 0;
    animation: slideUp 1s ease 3.2s forwards;
    max-width: 320px;
    margin: 0 auto;
    line-height: 1.9;
  }

  .subtitle .highlight {
    color: var(--rose-light);
  }

  .btn {
    margin-top: 2.8rem;
    display: inline-block;
    padding: 0.75rem 2.5rem;
    border: 1px solid rgba(201,70,90,0.4);
    background: transparent;
    color: var(--rose-light);
    font-family: 'Courier Prime', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.4s ease;
    opacity: 0;
    animation: slideUp 1s ease 3.8s forwards;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(201,70,90,0.08);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
  }

  .btn:hover::before { transform: scaleX(1); }
  .btn:hover {
    border-color: var(--rose);
    color: var(--cream);
    box-shadow: 0 0 30px rgba(201,70,90,0.2);
    letter-spacing: 0.4em;
  }

  /* Floating petals */
  .petal {
    position: fixed;
    pointer-events: none;
    z-index: 2;
    font-size: 1rem;
    animation: petalFall linear forwards;
    opacity: 0;
  }

  @keyframes petalFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* Click burst */
  .burst {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    font-size: 1.4rem;
    animation: burstOut 1s ease forwards;
    transform-origin: center;
  }

  @keyframes burstOut {
    0%   { transform: scale(0) translate(0, 0); opacity: 1; }
    100% { transform: scale(1.5) translate(var(--dx), var(--dy)); opacity: 0; }
  }

  /* Corner decoration */
  .corner {
    position: fixed;
    width: 60px;
    height: 60px;
    opacity: 0.15;
    animation: fadeIn 2s ease 4s forwards;
  }
  .corner.tl { top: 20px; left: 20px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
  .corner.tr { top: 20px; right: 20px; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); }
  .corner.bl { bottom: 20px; left: 20px; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); }
  .corner.br { bottom: 20px; right: 20px; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); }

  /* Code easter egg */
  .code-block {
    margin-top: 2.5rem;
    font-family: 'Courier Prime', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    opacity: 0;
    line-height: 1.8;
    animation: slideUp 1s ease 4.2s forwards;
    text-align: left;
    display: inline-block;
  }

  .code-block .kw  { color: #c9465a; }
  .code-block .fn  { color: #d4a853; }
  .code-block .str { color: #8fbf8f; }
  .code-block .cm  { color: #4a3f45; }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="container">
  <p class="eyebrow">— a message for you —</p>

  <div class="heart-wrap">
    <svg class="heart-svg" viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 85 C50 85 5 55 5 28 C5 14 16 5 28 5 C36 5 44 10 50 18 C56 10 64 5 72 5 C84 5 95 14 95 28 C95 55 50 85 50 85Z"
            fill="url(#hg)" stroke="rgba(201,70,90,0.3)" stroke-width="1"/>
      <defs>
        <radialGradient id="hg" cx="50%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#e8869a"/>
          <stop offset="60%" stop-color="#c9465a"/>
          <stop offset="100%" stop-color="#7a1a2a"/>
        </radialGradient>
      </defs>
    </svg>
  </div>

  <h1 class="main-title">
     <span class="italic">Love</span><br>you😋🤭♥️
  </h1>

  <div class="divider"></div>

  <p class="subtitle">
    <br>
     <span class="highlight">syntax</span>,<br>
    
  </p>

  <button class="btn" onclick="moreHearts()">click pentru magie ✦</button>

  <div class="code-block">
<span class="cm">// </span><br>
<span class="kw">const</span> <span class="fn">love</span> = () =&gt; {<br>
&nbsp;&nbsp;<span class="kw">return</span> <span class="str">"Love you🤭😋"</span>;<br>
};<br><br>
<span class="cm">// always true</span><br>
<span class="fn">console</span>.log( <span class="fn">love</span>() ); <span class="cm">// → i love you</span>
  </div>
</div>

<script>
  // Starfield
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const stars = Array.from({length: 120}, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    r: Math.random() * 1.2 + 0.2,
    alpha: Math.random(),
    speed: Math.random() * 0.008 + 0.002,
    phase: Math.random() * Math.PI * 2
  }));

  let t = 0;
  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    t += 0.01;
    stars.forEach(s => {
      const a = 0.2 + 0.5 * Math.abs(Math.sin(t * s.speed * 10 + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(245,237,224,${a})`;
      ctx.fill();
    });
    requestAnimationFrame(drawStars);
  }
  drawStars();

  // Falling petals loop
  const petals = ['🌸','✿','❀','♥','✦','❋'];
  function spawnPetal() {
    const el = document.createElement('div');
    el.className = 'petal';
    el.textContent = petals[Math.floor(Math.random() * petals.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (0.7 + Math.random() * 0.8) + 'rem';
    const dur = 6 + Math.random() * 8;
    el.style.animation = `petalFall ${dur}s linear forwards`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000);
  }
  setInterval(spawnPetal, 900);

  // Click burst
  document.addEventListener('click', (e) => {
    if (e.target.classList.contains('btn')) return;
    const emojis = ['❤️','💕','✨','🌸','💖','⭐'];
    for (let i = 0; i < 6; i++) {
      const b = document.createElement('div');
      b.className = 'burst';
      b.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      b.style.left = e.clientX + 'px';
      b.style.top  = e.clientY + 'px';
      const angle = (i / 6) * Math.PI * 2;
      const dist = 60 + Math.random() * 40;
      b.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      b.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 1000);
    }
  });

  // Button: burst of hearts
  function moreHearts() {
    for (let i = 0; i < 12; i++) {
      setTimeout(() => spawnPetal(), i * 80);
    }
    // Flash glow
    document.querySelector('.heart-svg').style.filter =
      'drop-shadow(0 0 40px rgba(201,70,90,1)) drop-shadow(0 0 80px rgba(201,70,90,0.7))';
    setTimeout(() => {
      document.querySelector('.heart-svg').style.filter = '';
    }, 600);
  }
</script>
</body>
</html>
